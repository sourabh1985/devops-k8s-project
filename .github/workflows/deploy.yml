name: Deploy

on:
  push:
    branches: [gitops]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ✅ Docker login
    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

    # ✅ Build & Push images (CI only)
    - name: Build and Push Images
      run: |
        docker build -t ${{ secrets.DOCKER_USER }}/backend:latest ./backend/service1
        docker push ${{ secrets.DOCKER_USER }}/backend:latest

        docker build -t ${{ secrets.DOCKER_USER }}/frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USER }}/frontend:latest

    # ✅ Setup Infra + ArgoCD on EC2
    - name: Setup Kubernetes + ArgoCD
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_IP }}
        username: ec2-user
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo su - <<'EOF'

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          # ✅ Install Helm
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          # ✅ Install Ingress
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
          helm repo update

          if ! helm list -n ingress-nginx | grep ingress-nginx; then
            helm install ingress-nginx ingress-nginx/ingress-nginx \
              --namespace ingress-nginx \
              --create-namespace \
              --set controller.service.type=NodePort
            sleep 30
          fi

          # ✅ Install ArgoCD
          kubectl create namespace argocd || true

          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          sleep 60

          # ✅ Expose ArgoCD UI
          kubectl patch svc argocd-server -n argocd \
            -p '{"spec": {"type": "NodePort"}}'

          echo "✅ ArgoCD installed"

          EOF

