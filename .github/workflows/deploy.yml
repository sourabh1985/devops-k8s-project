name: Build & Deploy — K8s Phase 3 (GitOps + Rollouts)

on:
  push:
    branches: [multi-node-k8s]
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}

jobs:
  # ── Job 1: Build & push all Docker images ─────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build & Push service1
        run: |
          docker build -t $DOCKER_USER/service1:latest -t $DOCKER_USER/service1:${{ github.sha }} ./backend/service1
          docker push $DOCKER_USER/service1:latest
          docker push $DOCKER_USER/service1:${{ github.sha }}

      - name: Build & Push service2
        run: |
          docker build -t $DOCKER_USER/service2:latest -t $DOCKER_USER/service2:${{ github.sha }} ./backend/service2
          docker push $DOCKER_USER/service2:latest
          docker push $DOCKER_USER/service2:${{ github.sha }}

      - name: Build & Push service3
        run: |
          docker build -t $DOCKER_USER/service3:latest -t $DOCKER_USER/service3:${{ github.sha }} ./backend/service3
          docker push $DOCKER_USER/service3:latest
          docker push $DOCKER_USER/service3:${{ github.sha }}

      - name: Build & Push frontend
        run: |
          docker build -t $DOCKER_USER/frontend:latest -t $DOCKER_USER/frontend:${{ github.sha }} ./frontend
          docker push $DOCKER_USER/frontend:latest
          docker push $DOCKER_USER/frontend:${{ github.sha }}

  # ── Job 2: Bootstrap cluster (idempotent) ─────────────────────
  # Installs nginx-ingress, ArgoCD, Argo Rollouts if not present.
  # On subsequent runs these are all skipped quickly.
  bootstrap:
    name: Bootstrap Cluster
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx-ingress (if missing)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            RUNNING=$(kubectl get pods -n ingress-nginx \
              --field-selector=status.phase=Running --no-headers 2>/dev/null \
              | grep -c "ingress-nginx-controller" || true)

            if [ "$RUNNING" -ge "1" ]; then
              echo "nginx-ingress already running, skipping"
            else
              helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
              helm repo update
              helm install ingress-nginx ingress-nginx/ingress-nginx \
                --namespace ingress-nginx --create-namespace \
                --set controller.service.type=NodePort \
                --set controller.service.nodePorts.http=30080 \
                --set controller.service.nodePorts.https=30444 \
                --wait --timeout=180s
              echo "nginx-ingress installed"
            fi

      - name: Install ArgoCD (if missing)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            if kubectl get ns argocd &>/dev/null; then
              echo "ArgoCD already installed, skipping"
            else
              kubectl create namespace argocd
              kubectl apply -n argocd \
                -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

              kubectl wait --for=condition=available \
                deployment/argocd-server -n argocd --timeout=300s

              kubectl patch svc argocd-server -n argocd \
                -p '{"spec": {"type": "NodePort", "ports": [{"port": 443, "nodePort": 30443, "targetPort": 8080}]}}'

              echo "ArgoCD installed on NodePort 30443"
            fi

      - name: Install Argo Rollouts (if missing)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            if kubectl get ns argo-rollouts &>/dev/null; then
              echo "Argo Rollouts already installed, skipping"
            else
              kubectl create namespace argo-rollouts
              kubectl apply -n argo-rollouts \
                -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml

              kubectl wait --for=condition=available \
                deployment/argo-rollouts -n argo-rollouts --timeout=180s

              echo "Argo Rollouts installed"
            fi

      - name: Create namespaces (dev + prod)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl apply -f /home/ec2-user/k8s/namespaces.yaml 2>/dev/null || \
              kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f - && \
              kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
            echo "Namespaces ready"
            kubectl get namespaces | grep -E "dev|prod|argocd|argo-rollouts"

  # ── Job 3: Register ArgoCD Applications (GitOps) ──────────────
  # Applies the ArgoCD Application CRDs — after this ArgoCD owns all deploys.
  # dev  → auto-sync (deploys immediately on git push)
  # prod → manual sync (requires approval in ArgoCD UI)
  gitops:
    name: Register ArgoCD Apps
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Copy ArgoCD app manifests & namespaces to master
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: "argocd/,k8s/namespaces.yaml"
          target: "/home/ec2-user/"

      - name: Apply ArgoCD Application CRDs
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "=== Applying namespaces ==="
            kubectl apply -f /home/ec2-user/k8s/namespaces.yaml

            echo "=== Registering ArgoCD Applications ==="
            kubectl apply -f /home/ec2-user/argocd/app-dev.yaml
            kubectl apply -f /home/ec2-user/argocd/app-prod.yaml

            echo ""
            echo "=== ArgoCD Applications ==="
            kubectl get applications -n argocd

            echo ""
            echo "ArgoCD now manages deployments via GitOps."
            echo "  dev  → auto-sync  (deploys on every git push)"
            echo "  prod → manual sync (approve in ArgoCD UI: http://\$(curl -sf http://169.254.169.254/latest/meta-data/public-ipv4):30443)"

  # ── Job 4: Smoke test ──────────────────────────────────────────
  # Waits for ArgoCD to sync dev, then hits all endpoints
  smoke-test:
    name: Smoke Test (dev)
    runs-on: ubuntu-latest
    needs: gitops
    steps:
      - name: Wait for ArgoCD dev sync & health check
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "Waiting for dev namespace pods to be ready..."
            kubectl wait --for=condition=ready pod \
              -l env=dev -n dev --timeout=180s || true

            echo ""
            echo "=== Dev Pods ==="
            kubectl get pods -n dev -o wide

            echo ""
            echo "=== Dev Ingress ==="
            kubectl get ingress -n dev

      - name: HTTP smoke test — dev endpoints
        run: |
          BASE="http://${{ secrets.EC2_IP }}:30080"
          echo "Smoke testing $BASE ..."
          sleep 15

          for path in "/" "/api/service1" "/api/service2" "/api/service3"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE$path" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  $path → HTTP $STATUS ✅"
            else
              echo "  $path → HTTP $STATUS ⚠️"
            fi
          done
