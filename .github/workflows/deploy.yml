name: Build & Deploy — Multi-Node K8s

on:
  push:
    branches: [multi-node-k8s]
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}

jobs:
  # ── Job 1: Build & push all Docker images ─────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build & Push service1
        run: |
          docker build -t $DOCKER_USER/service1:latest -t $DOCKER_USER/service1:${{ github.sha }} ./backend/service1
          docker push $DOCKER_USER/service1:latest
          docker push $DOCKER_USER/service1:${{ github.sha }}

      - name: Build & Push service2
        run: |
          docker build -t $DOCKER_USER/service2:latest -t $DOCKER_USER/service2:${{ github.sha }} ./backend/service2
          docker push $DOCKER_USER/service2:latest
          docker push $DOCKER_USER/service2:${{ github.sha }}

      - name: Build & Push service3
        run: |
          docker build -t $DOCKER_USER/service3:latest -t $DOCKER_USER/service3:${{ github.sha }} ./backend/service3
          docker push $DOCKER_USER/service3:latest
          docker push $DOCKER_USER/service3:${{ github.sha }}

      - name: Build & Push frontend
        run: |
          docker build -t $DOCKER_USER/frontend:latest -t $DOCKER_USER/frontend:${{ github.sha }} ./frontend
          docker push $DOCKER_USER/frontend:latest
          docker push $DOCKER_USER/frontend:${{ github.sha }}

  # ── Job 2: Deploy to k3s cluster ──────────────────────────────
  deploy:
    name: Deploy to k3s Cluster
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Step 1 — Install ArgoCD (skip if already installed)
      - name: Install ArgoCD
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            if kubectl get ns argocd &>/dev/null; then
              echo "ArgoCD already installed, skipping"
              exit 0
            fi

            kubectl create namespace argocd
            kubectl apply -n argocd \
              -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

            echo "Waiting for argocd-server to be ready..."
            kubectl wait --for=condition=available \
              deployment/argocd-server -n argocd --timeout=300s

            kubectl patch svc argocd-server -n argocd \
              -p '{"spec": {"type": "NodePort", "ports": [{"port": 443, "nodePort": 30443, "targetPort": 8080}]}}'

            echo "ArgoCD installed and exposed on NodePort 30443"

      # Step 2 — Copy k8s manifests to master
      - name: Copy K8s manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: "k8s/"
          target: "/home/ec2-user/"

      # Step 3 — Apply manifests and deploy
      - name: Apply manifests & rollout
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "=== Applying K8s manifests ==="
            kubectl apply -f /home/ec2-user/k8s/backend-service.yaml
            kubectl apply -f /home/ec2-user/k8s/service.yaml
            kubectl apply -f /home/ec2-user/k8s/backend.yaml
            kubectl apply -f /home/ec2-user/k8s/frontend.yaml
            kubectl apply -f /home/ec2-user/k8s/ingress.yml

            echo "=== Rolling restart to pull latest images ==="
            kubectl rollout restart deployment/service1
            kubectl rollout restart deployment/service2
            kubectl rollout restart deployment/service3
            kubectl rollout restart deployment/frontend

            echo "=== Waiting for rollouts to complete ==="
            kubectl rollout status deployment/service1 --timeout=120s
            kubectl rollout status deployment/service2 --timeout=120s
            kubectl rollout status deployment/service3 --timeout=120s
            kubectl rollout status deployment/frontend  --timeout=120s

            echo ""
            echo "=== All pods ==="
            kubectl get pods -o wide

            echo ""
            echo "=== All nodes ==="
            kubectl get nodes -o wide

            echo ""
            echo "Deployment complete!"

  # ── Job 3: Smoke test ──────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check all endpoints
        run: |
          BASE="http://${{ secrets.EC2_IP }}:30080"
          echo "Testing $BASE ..."
          sleep 15

          ALL_OK=true
          for path in "/" "/api/service1" "/api/service2" "/api/service3"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE$path" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  $path → HTTP $STATUS ✅"
            else
              echo "  $path → HTTP $STATUS ⚠️"
              ALL_OK=false
            fi
          done

          if [ "$ALL_OK" = "true" ]; then
            echo "All endpoints healthy!"
          else
            echo "Some endpoints not yet ready — pods may still be starting"
          fi
