name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

    - name: Build and Push Images
      run: |
        docker build -t ${{ secrets.DOCKER_USER }}/backend:latest ./backend/service1
        docker push ${{ secrets.DOCKER_USER }}/backend:latest

        docker build -t ${{ secrets.DOCKER_USER }}/frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USER }}/frontend:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_IP }}
        username: ec2-user
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo su - <<'EOF'

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          # Install Helm (if not installed)
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          # Add repo
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
          helm repo update

          # ✅ Install ingress if not installed
          if ! helm list -n ingress-nginx | grep ingress-nginx; then
            helm install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=NodePort
            sleep 30
          fi

          cd /home/ec2-user

          if [ ! -d devops-k8s-project ]; then
            git clone https://github.com/sourabh1985/devops-k8s-project
          fi

          cd devops-k8s-project
          git pull

          kubectl apply -f k8s/

          EOF
