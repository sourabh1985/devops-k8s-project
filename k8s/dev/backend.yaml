---
# ── Dev: Order Service (service1) ────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service1
  namespace: dev
  labels:
    app: service1
    env: dev
spec:
  replicas: 1          # lean replica count for dev
  selector:
    matchLabels:
      app: service1
  template:
    metadata:
      labels:
        app: service1
        env: dev
    spec:
      containers:
        - name: service1
          image: sourabhjha108/service1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
            - name: ENVIRONMENT
              value: "dev"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
