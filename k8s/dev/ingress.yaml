apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-dev
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # Rewrite: strip the /dev prefix so Flask sees its own routes.
    # Example: /dev/api/service1 → /api/service1
    # The regex captures everything after /dev into $2
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /dev/api/service1 → Flask sees /api/service1
          - path: /dev/(api/service1.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service1
                port:
                  number: 5000

          # /dev/api/service2 → Flask sees /api/service2
          - path: /dev/(api/service2.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service2
                port:
                  number: 5001

          # /dev/api/service3 → Flask sees /api/service3
          - path: /dev/(api/service3.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service3
                port:
                  number: 5002

          # /dev or /dev/ → frontend sees /
          - path: /dev(/?.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
