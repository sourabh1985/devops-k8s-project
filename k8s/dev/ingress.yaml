apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-dev
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # Rewrite strips /dev prefix.
    # Pattern /dev/(.*) captures everything after /dev/ into $1
    # rewrite-target: /$1 → /dev/api/service1 becomes /api/service1
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /dev/api/service1 → Flask sees /api/service1
          - path: /dev/api/service1(/?.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service1
                port:
                  number: 5000

          # /dev/api/service2 → Flask sees /api/service2
          - path: /dev/api/service2(/?.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service2
                port:
                  number: 5001

          # /dev/api/service3 → Flask sees /api/service3
          - path: /dev/api/service3(/?.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service3
                port:
                  number: 5002

          # /dev or /dev/anything-else → frontend sees /
          - path: /dev(/?.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
