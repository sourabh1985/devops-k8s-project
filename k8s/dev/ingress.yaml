apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-dev
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # Canary annotation — traffic splitting for service1 (10% to canary)
    nginx.ingress.kubernetes.io/canary: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/service1
            pathType: Prefix
            backend:
              service:
                name: service1
                port:
                  number: 5000
          - path: /api/service2
            pathType: Prefix
            backend:
              service:
                name: service2
                port:
                  number: 5001
          - path: /api/service3
            pathType: Prefix
            backend:
              service:
                name: service3
                port:
                  number: 5002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
