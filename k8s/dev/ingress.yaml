apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-dev
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # No rewrite needed — dev controller only handles dev namespace
    # traffic arrives on :31080 and routes to the same /api/service* paths
spec:
  ingressClassName: nginx-dev      # ← routes through dev controller (:31080)
  rules:
    - http:
        paths:
          - path: /api/service1
            pathType: Prefix
            backend:
              service:
                name: service1
                port:
                  number: 5000
          - path: /api/service2
            pathType: Prefix
            backend:
              service:
                name: service2
                port:
                  number: 5001
          - path: /api/service3
            pathType: Prefix
            backend:
              service:
                name: service3
                port:
                  number: 5002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
