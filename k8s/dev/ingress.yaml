---
# ── Dev: service1 ingress — /dev/api/service1 → /api/service1 ─
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-dev-service1
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/service1$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /dev/api/service1(/?.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service1
                port:
                  number: 5000
---
