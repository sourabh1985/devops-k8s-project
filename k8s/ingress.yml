apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  rules:
    - http:
        paths:
          # ── Backend services ──────────────────────────────
          - path: /api/service1
            pathType: Prefix
            backend:
              service:
                name: service1
                port:
                  number: 5000

          - path: /api/service2
            pathType: Prefix
            backend:
              service:
                name: service2
                port:
                  number: 5001

          - path: /api/service3
            pathType: Prefix
            backend:
              service:
                name: service3
                port:
                  number: 5002

          # ── Frontend ──────────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
