---
# service1 — single ClusterIP (Argo Rollouts manages canary via pod labels)
apiVersion: v1
kind: Service
metadata:
  name: service1
  namespace: prod
  labels:
    app: service1
    env: prod
spec:
  type: ClusterIP
  selector:
    app: service1
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
---
# service2-active — Blue-Green ACTIVE (live traffic)
# Argo Rollouts switches selector between blue and green pods here
apiVersion: v1
kind: Service
metadata:
  name: service2-active
  namespace: prod
  labels:
    app: service2
    env: prod
    role: active
spec:
  type: ClusterIP
  selector:
    app: service2
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: 5001
---
# service2-preview — Blue-Green PREVIEW (green/new version only)
# Use this to test the new version before promoting
apiVersion: v1
kind: Service
metadata:
  name: service2-preview
  namespace: prod
  labels:
    app: service2
    env: prod
    role: preview
spec:
  type: ClusterIP
  selector:
    app: service2
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: service3
  namespace: prod
  labels:
    app: service3
    env: prod
spec:
  type: ClusterIP
  selector:
    app: service3
  ports:
    - name: http
      protocol: TCP
      port: 5002
      targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: prod
  labels:
    app: frontend
    env: prod
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
