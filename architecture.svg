<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="1100" height="860" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#38bdf8">Multi-Node K8s Architecture — DevOps Learning Project</text>
  <text x="550" y="64" text-anchor="middle" font-size="13" fill="#64748b">AWS ap-south-1 · k3s · GitHub Actions · ArgoCD · nginx-ingress</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 1: Developer + GitHub -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Developer box -->
  <rect x="30" y="90" width="140" height="70" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="118" text-anchor="middle" font-size="20">👨‍💻</text>
  <text x="100" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">Developer</text>
  <text x="100" y="153" text-anchor="middle" font-size="11" fill="#64748b">git push</text>

  <!-- Arrow: Developer → GitHub -->
  <line x1="170" y1="125" x2="230" y2="125" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="200" y="118" text-anchor="middle" font-size="10" fill="#64748b">push</text>

  <!-- GitHub Actions box -->
  <rect x="230" y="90" width="180" height="70" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="113" text-anchor="middle" font-size="11" fill="#94a3b8">⚙️  GitHub Actions CI/CD</text>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="#7dd3fc">1. Build Docker images</text>
  <text x="320" y="145" text-anchor="middle" font-size="11" fill="#7dd3fc">2. Push to Docker Hub</text>
  <text x="320" y="158" text-anchor="middle" font-size="10" fill="#64748b">deploy.yml</text>

  <!-- Arrow: GitHub → Docker Hub -->
  <line x1="410" y1="115" x2="480" y2="115" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="445" y="108" text-anchor="middle" font-size="10" fill="#64748b">push images</text>

  <!-- Docker Hub box -->
  <rect x="480" y="90" width="150" height="70" rx="10" fill="#1e3a5f" stroke="#0284c7" stroke-width="1.5"/>
  <text x="555" y="118" text-anchor="middle" font-size="20">🐳</text>
  <text x="555" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#7dd3fc">Docker Hub</text>
  <text x="555" y="153" text-anchor="middle" font-size="10" fill="#64748b">service1/2/3 + frontend</text>

  <!-- Arrow: GitHub → Master (SSH deploy) -->
  <line x1="320" y1="160" x2="320" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-yellow)"/>
  <text x="335" y="185" font-size="10" fill="#f59e0b">SSH deploy</text>

</svg>
